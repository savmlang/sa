[package]
name = "savmruncore"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[dependencies]
savmruntypes = { path = "../savmruntypes" }
sart = { path = "../../sart" }

ahash = "^0.8"
dashmap = "^6"
rusqlite = { version = "^0.40", features = ["bundled", "blob", "backup"] }

blake3 = "^1"

parking_lot = "^0.12"

lexical-core = "^1"
postcard = { version = "^1", default-features = false, features = ["alloc"] }

[target.'cfg(unix)'.dependencies]
libc = "^0.2"
sysinfo = "^0.39"

[target.'cfg(windows)'.dependencies]
windows = { version = "^0.62", features = [
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_Storage",
  "Win32_Storage_FileSystem",
] }
