[package]
name = "savmrun"
version = "0.1.0"
edition = "2024"

[dependencies]
savmruncore = { path = "../savmruncore" }

ahash = "^0.8"
dashmap = "^6"
rusqlite = { version = "^0.40", features = ["bundled", "blob", "backup"] }

blake3 = "^1"

savm = { path = "../../savm" }
parking_lot = "^0.12"

lexical-core = "^1"
postcard = { version = "^1", default-features = false, features = ["alloc"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "^0.62", features = [
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_Storage",
  "Win32_Storage_FileSystem",
] }
