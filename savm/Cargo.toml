[package]
name = "savm"
version = "0.1.0"
edition = "2024"

# license = "AGPL-3.0-only WITH LicenseRef-SaVM-Linking-Exception"
license-file = "../LICENSE"

[dependencies]
# Concurrency Maps
ahash = "^0.8"
evmap = { version = "^11", optional = true }
moka = { version = "^0.12", features = ["sync"] }

# Concurrent Units
rayon = "^1"
crossbeam-channel = { version = "^0.5", optional = true }

# Macro Helpers
pastey = "^0.2"

# Our concurrency runtime
tokio = { version = "^1", features = ["rt", "rt-multi-thread", "sync", "time"] }

# Sets of compiler
cranelift = { version = "^0.131", features = [
  "std",
  "native",
  "frontend",
], optional = true }
llvm-sys = { version = "=221.0.1", default-features = false, features = [
  "force-static",
  "disable-alltargets-init",
], optional = true }

# Sa Runtime
sart = { path = "../sart" }

# SaVM Native Linker and CodeAllocator
sajit = { version = "0.0.1", path = "../sajit", optional = true }
serde = { version = "^1", features = ["derive"] }

[features]
default = []

# Development mode (rust-analyzer)
dev = ["cranelift", "llvm", "sendback"]

llvm = ["dep:llvm-sys", "native"]
cranelift = ["dep:cranelift", "native"]
native = ["dep:sajit", "dep:evmap", "dep:crossbeam-channel"]

# Send JIT Generated Outputs back
# for satest mainly
sendback = ["native"]
