[package]
name = "savm"
version = "0.1.0"
edition = "2024"

[dependencies]
# Concurrency Maps
ahash = "^0.8"
dashmap = "^6"

# Macro Helpers
pastey = "^0.2"

# Our concurrency runtime
tokio = { version = "^1", features = ["rt", "rt-multi-thread", "sync", "time"] }

# Sets of compiler
cranelift = { version = "^0.129", features = [
  "module",
  "native",
], optional = true }

inkwell = { version = "^0.8", default-features = false, features = [
  "llvm21-1-prefer-static",
], optional = true }
object = { version = "^0.38", optional = true }

# Sa Runtime Types
sart = { path = "../sart" }

[target.'cfg(target_arch = "x86_64")'.dependencies]
inkwell = { version = "^0.8", features = ["target-x86"] }

[target.'cfg(target_arch = "x86")'.dependencies]
inkwell = { version = "^0.8", features = ["target-x86"] }

[target.'cfg(target_arch = "aarch64")'.dependencies]
inkwell = { version = "^0.8", features = ["target-aarch64"] }

[target.'cfg(target_arch = "riscv64")'.dependencies]
inkwell = { version = "^0.8", features = ["target-riscv"] }

[target.'cfg(target_arch = "mips64")'.dependencies]
inkwell = { version = "^0.8", features = ["target-mips"] }

[features]
default = ["llvm", "cranelift"]
llvm = ["dep:inkwell", "dep:object"]
cranelift = ["dep:cranelift"]
