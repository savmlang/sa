[workspace]
# Official SaVM Build Version
metadata.savm.version = "v0.0.1-nightly+3"

members = [
  # Sa VM (CORE)
  "savm",

  # Sa JIT Library
  "sajit",

  # Sa Runtime
  "sart",

  # Sa Runtime Allocator
  "sart/saffi/libsalloc",

  # Sa Runtime FFI
  "sart/saffi/ffi",

  # Sa Runtime Allocator Interface
  "sart/saffi/salloc",

  # Binaries
  "bin/sapacker",
  "bin/sasm",
  "bin/satest",
  "bin/savmruncore",
  "bin/savmrun",
  "bin/savmimgrun",
  "bin/savmrt",
  "bin/savmrtcache",

  # SaVM C Compatible Libraries (Future Experiments currently)
  # Dynamic Linkable AND Static Linkable
  # Depends on the C ABI (musl, glibc, msvc, applec)
  "libs/savmc",
  "libs/savm_easyc",
  "libs/sasmc",
  "libs/saffic",

  # Mixed Radix
  "mixedradix",
  "mixedradix/macros",
]
resolver = "3"

# These are testing and hence should not be directly bundled
exclude = ["acdagtests", "jitemission", "sajit/llvmtest"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
