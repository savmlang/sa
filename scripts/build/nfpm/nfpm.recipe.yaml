# yaml-language-server: $schema=https://nfpm.goreleaser.com/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

name: savm_{%edition}

# Must be provided with the ENV
# BUNDLE_ARCH="..."
arch: ${BUNDLE_ARCH}

# This is for linux only
platform: "linux"

# Our Preprocessor auto installs this
version: "{%version}"

priority: "standard"

# Each SaVM Conflicts with its 3 other editions
conflicts:
  - savm_{%C1}
  - savm_{%C2}
  - savm_{%C3}

maintainer: "Akshanabha Chakraborty <ahqsecret@gmail.com> (@ahqsoftwares) and SaVM Maintainers, Contributors"

description: |
  SaVM is a language Virtual Machine built with performance from the ground up.

vendor: The Sa Programming Language and SaVM Foundation

# TODO: Point to GitHub Pages Once Done
homepage: "https://github.com/savmlang"

license: "AGPL-3.0 With SaVM Linking Exception"

contents:
  - # Copy fully
    src: ${SAVM_EXPANDED}/
    dst: /opt/savm
    expand: true
    type: tree
    file_info:
      mode: 0755
      owner: root

  - src: "../../../LICENSE"
    dst: /opt/savm/LICENSE
    file_info:
      mode: 0755
      owner: root

  # Install core runtime libraries
  - src: /opt/savm/libsalloc.so
    dst: /usr/lib/libsalloc.so
    type: symlink
    file_info:
      mode: 0755
      owner: root

  - src: /opt/savm/libsavmasync.so
    dst: /usr/lib/libsavmasync.so
    type: symlink
    file_info:
      mode: 0755
      owner: root

  - src: /opt/savm/libsavmc.so
    dst: /usr/lib/libsavmc.so
    type: symlink
    file_info:
      mode: 0755
      owner: root

  - src: /opt/savm/libsasmc.so
    dst: /usr/lib/libsasmc.so
    type: symlink
    file_info:
      mode: 0755
      owner: root

  # Install SaVM Binaries
  - src: /opt/savm/savmrun
    dst: /usr/bin/savmrun
    type: symlink
    file_info:
      mode: 0755
      owner: root

  - src: /opt/savm/savmrtcache
    dst: /usr/bin/savmrtcache
    type: symlink
    file_info:
      mode: 0755
      owner: root

  - src: /opt/savm/savmrt
    dst: /usr/bin/savmrt
    type: symlink
    file_info:
      mode: 0755
      owner: root

  - src: /opt/savm/savmimgrun
    dst: /usr/bin/savmimgrun
    type: symlink
    file_info:
      mode: 0755
      owner: root

  - src: /opt/savm/satest
    dst: /usr/bin/satest
    type: symlink
    file_info:
      mode: 0755
      owner: root

  - src: /opt/savm/sapacker
    dst: /usr/bin/sapacker
    type: symlink
    file_info:
      mode: 0755
      owner: root
  
  - src: /opt/savm/sasm
    dst: /usr/bin/sasm
    type: symlink
    file_info:
      mode: 0755
      owner: root

  # TODO: Desktop Registration once savmrun can handle `.sabin` files

# Just to ensure no one gets any by chance !0o755
umask: 0o002

scripts:
  postinstall: ./linux/postinstall.sh

# Most builds are selfcontained and GLIBC dependent only
depends: []

# MUSL ones have extra dependencies
overrides:
  ipk:
    depends:
      - libffi
      - libgcc
      - zlib
      - zstd-libs
      - libstdc++

  apk:
    depends:
      - libffi
      - libgcc
      - zlib
      - zstd-libs
      - libstdc++

# The Below is a preprocessor entry
# On non-release build, we want to strip it entirely
!#RELEASE
deb:
  signature:
    method: debsign
    signer: Akshanabha Chakraborty <ahqsecret@gmail.com>
    type: origin
    key_file: '{%KEYGPG}'
    key_id: ${GPG_KEY_ID}

rpm:
  signature:
    key_file: '{%KEYGPG}'
    key_id: ${GPG_KEY_ID}

apk:
  signature:
    key_file: '{%KEYPEM}'
    key_name: savm_development
