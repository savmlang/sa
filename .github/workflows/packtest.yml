name: Package Test SaVM

on:
  push:

jobs:
  begin:
    name: Await Approval
    environment:
      name: Publishing

    runs-on: ubuntu-latest

    # Outputs
    outputs:
      GPG_KEY_B64: ${{ steps.secrets.outputs.GPG_KEY_B64 }}
      GPG_KEY_ID: ${{ steps.secrets.outputs.GPG_KEY_ID }}
      GPG_PASSPHRASE: ${{ steps.secrets.outputs.GPG_PASSPHRASE }}

    steps:
      - name: Pass Secrets
        id: secrets
        run: |
          echo "::add-mask::${{ secrets.GPG_KEY_ID }}"
          echo "::add-mask::${{ secrets.GPG_PASSPHRASE }}"

          # Use multiline to pass strings
          cat << 'EOF' > key.gpg
          ${{ secrets.GPG_KEY }}
          EOF

          base64key=$(cat key.gpg | base64 | tr -d '\n')

          base64enc=$(echo -n "$base64key" | openssl enc -aes-256-cbc -pbkdf2 -a -A -k "${{ secrets.CROSS_WORKFLOW_ENCRYPT_TEST }}")
          gpgkeyid=$(echo -n "${{ secrets.GPG_KEY_ID }}" | openssl enc -aes-256-cbc -pbkdf2 -a -A -k "${{ secrets.CROSS_WORKFLOW_ENCRYPT_TEST }}")
          gpgpassphrase=$(echo -n "${{ secrets.GPG_PASSPHRASE }}" | openssl enc -aes-256-cbc -pbkdf2 -a -A -k "${{ secrets.CROSS_WORKFLOW_ENCRYPT_TEST }}")

          echo "::add-mask::$base64key"
          echo "GPG_KEY_B64=$base64enc" >> "$GITHUB_OUTPUT"

          rm key.gpg

          echo "GPG_KEY_ID=$gpgkeyid" >> "$GITHUB_OUTPUT"
          echo "GPG_PASSPHRASE=$gpgpassphrase" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish Official SaVM
    needs: [begin]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rustup
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src,rustfmt
          toolchain: nightly

      - name: Restore GPG key
        working-directory: scripts/build/nfpm
        run: |
          b64=$(echo -n "${{ needs.begin.outputs.GPG_KEY_B64 }}" | openssl enc -d -aes-256-cbc -pbkdf2 -a -A -k "${{ secrets.CROSS_WORKFLOW_ENCRYPT_TEST }}")

          echo "::add-mask::$b64"
          echo "$b64" | base64 -d > key.gpg

      - name: Generate timestamp
        id: version
        shell: pwsh
        run: |
          $version = $(./scripts/build/getVersion.ps1)
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Unencrypt data
        id: unencrypt
        working-directory: scripts/build
        run: |
          keyid=$(echo -n "${{ needs.begin.outputs.GPG_KEY_ID }}" | openssl enc -d -aes-256-cbc -pbkdf2 -a -A -k "${{ secrets.CROSS_WORKFLOW_ENCRYPT_TEST }}")
          passphrase=$(echo -n "${{ needs.begin.outputs.GPG_PASSPHRASE }}" | openssl enc -d -aes-256-cbc -pbkdf2 -a -A -k "${{ secrets.CROSS_WORKFLOW_ENCRYPT_TEST }}")

          echo "::add-mask::$keyid"
          echo "::add-mask::$passphrase"

          echo "GPG_KEY_ID=$keyid" >> "$GITHUB_OUTPUT"
          echo "GPG_PASSPHRASE=$passphrase" >> "$GITHUB_OUTPUT"

      - name: Download & Build Installers
        shell: pwsh
        run: |
          gh run download 30831245521 --pattern *x86_64-unknown-linux-gnu* --dir release

          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt update
          sudo apt install nfpm

          ./extract.ps1
          ./build.ps1
        env:
          GH_TOKEN: ${{ github.token }}
          GPG_KEY_ID: ${{ steps.unencrypt.outputs.GPG_KEY_ID }}
          NFPM_PASSPHRASE: ${{  steps.unencrypt.outputs.GPG_PASSPHRASE }}
          LINBUILD: true
          RELEASE: true
        continue-on-error: true
        working-directory: scripts/build

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          path: |
            ./scripts/build/
