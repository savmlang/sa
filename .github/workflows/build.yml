name: Build SaVM for Release

on:
  push:
    tags:
      - v*
    branches:
      - cicd-*

permissions:
  contents: write
  attestations: write

jobs:
  begin:
    name: Await Approval
    environment:
      name: Publishing

    runs-on: ubuntu-latest

    outputs:
      GPG_KEY_B64: ${{ steps.secrets.outputs.GPG_KEY_B64 }}
      GPG_KEY_ID: ${{ steps.secrets.outputs.GPG_KEY_ID }}
      GPG_PASSPHRASE: ${{ steps.secrets.outputs.GPG_PASSPHRASE }}

    steps:
      - name: Pass Secrets
        id: secrets
        run: |
          echo "::add-mask::${{ secrets.GPG_KEY }}"
          echo "::add-mask::${{ secrets.GPG_KEY_ID }}"
          echo "::add-mask::${{ secrets.GPG_PASSPHRASE }}"

          base64enc=$(echo -n "${{ secrets.GPG_KEY }}" | openssl enc -aes-256-cbc -pbkdf2 -a -A -k "${{ secrets.CROSS_WORKFLOW_ENCRYPT }}")
          gpgkeyid=$(echo -n "${{ secrets.GPG_KEY_ID }}" | openssl enc -aes-256-cbc -pbkdf2 -a -A -k "${{ secrets.CROSS_WORKFLOW_ENCRYPT }}")
          gpgpassphrase=$(echo -n "${{ secrets.GPG_PASSPHRASE }}" | openssl enc -aes-256-cbc -pbkdf2 -a -A -k "${{ secrets.CROSS_WORKFLOW_ENCRYPT }}")

          echo "GPG_KEY_B64=$base64enc" >> "$GITHUB_OUTPUT"
          echo "GPG_KEY_ID=$gpgkeyid" >> "$GITHUB_OUTPUT"
          echo "GPG_PASSPHRASE=$gpgpassphrase" >> "$GITHUB_OUTPUT"

  # Builds can start while approval awaits
  build:
    name: Build SaVM
    uses: ./.github/workflows/buildtest.yml

    with:
      artifact: "true"

  publish:
    name: Publish Official SaVM
    needs: [begin, build]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rustup
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src,rustfmt
          toolchain: nightly

      - name: Unencrypt data
        id: unencrypt
        run: |
          keyid=$(echo -n "${{ needs.begin.outputs.GPG_KEY_ID }}" | openssl enc -d -aes-256-cbc -pbkdf2 -a -A -k "${{ secrets.CROSS_WORKFLOW_ENCRYPT }}")
          passphrase=$(echo -n "${{ needs.begin.outputs.GPG_PASSPHRASE }}" | openssl enc -d -aes-256-cbc -pbkdf2 -a -A -k "${{ secrets.CROSS_WORKFLOW_ENCRYPT }}")

          echo "::add-mask::$keyid"
          echo "::add-mask::$passphrase"

          echo "GPG_KEY_ID=$keyid" >> "$GITHUB_OUTPUT"
          echo "GPG_PASSPHRASE=$passphrase" >> "$GITHUB_OUTPUT"

      - name: Restore GPG key
        working-directory: scripts/build/nfpm
        run: |
          b64=$(echo -n "${{ needs.begin.outputs.GPG_KEY_B64 }}" | openssl enc -d -aes-256-cbc -pbkdf2 -a -A -k "${{ secrets.CROSS_WORKFLOW_ENCRYPT }}")

          echo "::add-mask::$b64"
          echo "$b64" | base64 -d > key.gpg

          # Generate the raw RSA PEM File too
          GPG_PASSPHRASE="${{ steps.unencrypt.outputs.GPG_PASSPHRASE }}"
          GPG_KEYID="${{ steps.unencrypt.outputs.GPG_KEY_ID }}"
          echo "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --import key.gpg

      - name: Generate timestamp
        id: version
        shell: pwsh
        run: |
          $version = $(./scripts/build/getVersion.ps1)
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Download & Build Installers
        shell: pwsh
        run: |
          gh run download ${{ github.run_id }} --dir release

          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt update
          sudo apt install nfpm

          ./extract.ps1
          ./build.ps1
        env:
          GH_TOKEN: ${{ github.token }}
          GPG_KEY_ID: ${{ steps.unencrypt.outputs.GPG_KEY_ID }}
          NFPM_PASSPHRASE: ${{  steps.unencrypt.outputs.GPG_PASSPHRASE }}
          LINBUILD: true
          RELEASE: true
        working-directory: scripts/build

      - name: Release Artifacts
        uses: softprops/action-gh-release@v3
        id: release
        with:
          tag_name: v${{ steps.version.outputs.version }}
          draft: true
          body: |
            This is an autogenerated build of the whole of SaVM.
          files: |
            ./scripts/build/outputs/**/*
            ./scripts/build/release/**/*.zip

      - name: Undraft
        run: gh release edit v${{ steps.version.outputs.version }} --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
