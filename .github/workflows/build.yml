name: SaVM Build Test

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  attestations: write

jobs:
  win32:
    name: Build SaVM ${{ matrix.feature }} (${{ matrix.target }})

    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        target: [ x86_64-pc-windows-msvc, aarch64-pc-windows-msvc, i686-pc-windows-msvc ]
        feature: [ nano, standard, pro, pro_standard ]

        exclude:
          - target: i686-pc-windows-msvc
            feature: standard

          - target: i686-pc-windows-msvc
            feature: pro_standard

    runs-on: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build SaVM
        uses: ./.github/actions/build-savm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          llvmargs: --llvm-build=llvm-static-${{ matrix.target }}.tar.gz
          feature: ${{ matrix.feature }}
          rusttarget: ${{ matrix.target }}
          argv: --target ${{ matrix.target }}

  darwin:
    name: Build SaVM ${{ matrix.feature }} (${{ matrix.target[0] }})

    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        target:
          [
            [ x86_64-apple-darwin, x86_64-apple-darwin ],
            [ aarch64-apple-darwin, arm64-apple-darwin ],
          ]
        feature: [ nano, standard, pro, pro_standard ]

    runs-on: ${{ matrix.target[0] == 'aarch64-apple-darwin' && 'macos-15' ||
      'macos-15-intel' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build SaVM
        uses: ./.github/actions/build-savm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          llvmargs: --llvm-build=llvm-static-${{ matrix.target[1] }}.tar.gz
          feature: ${{ matrix.feature }}
          rusttarget: ${{ matrix.target[0] }}
          argv: --target ${{ matrix.target[0] }}

  linux:
    name: Build SaVM ${{ matrix.feature }} (${{ matrix.target[0] }})

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        feature: [ nano, standard, pro, pro_standard ]
        target:
          [
            [ aarch64-unknown-linux-gnu, aarch64-linux-gnu ],
            [ x86_64-unknown-linux-gnu, x86_64-linux-gnu ],
            [ i686-unknown-linux-gnu, i686-linux-gnu ],
          ]

        include:
          - os: ubuntu-22.04-arm
            target: [ aarch64-unknown-linux-gnu, aarch64-linux-gnu ]

        exclude:
          - target: [ i686-unknown-linux-gnu, i686-linux-gnu ]
            feature: standard

          - target: [ i686-unknown-linux-gnu, i686-linux-gnu ]
            feature: pro_standard

    runs-on: ${{ matrix.os || 'ubuntu-22.04' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build SaVM
        uses: ./.github/actions/build-savm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          llvmargs: --llvm-build=llvm-static-${{ matrix.target[1] }}.tar.gz
          feature: ${{ matrix.feature }}
          rusttarget: ${{ matrix.target[0] }}
          argv: --target ${{ matrix.target[0] }}

  linux_crosscompile:
    name: Build SaVM ${{ matrix.feature }} (${{ matrix.target.name }})

    strategy:
      fail-fast: false

      matrix:
        target:
          - name: mips64el-unknown-linux-gnuabi64
            llvm: mips64el-linux-gnu
            rustflags: |
              -Zbuild-std=std,core,alloc -C linker=clang -C link-arg=--target=mips64el-unknown-linux-gnuabi64 -C link-arg=-fuse-ld=lld -C link-arg=--sysroot=/usr/mips64el-linux-gnuabi64
            buildstd: true
            tools: |
              gcc-mips64el-linux-gnuabi64 g++-mips64el-linux-gnuabi64 \
              binutils-mips64el-linux-gnuabi64 \
              libc6-dev-mips64el-cross \ 
              lsb-release software-properties-common gnupg
            buildllvm: |
              wget https://apt.llvm.org/llvm.sh
              chmod +x llvm.sh
              sudo ./llvm.sh 22

          - name: loongarch64-unknown-linux-gnu
            llvm: loongarch64-linux-gnu
            buildstd: false
            rustflags: |
              -C linker=clang -C link-arg=--target=loongarch64-unknown-linux-gnu -C link-arg=-fuse-ld=lld -C link-arg=--sysroot=/usr/loongarch64-unknown-linux-gnu
            tools: |
              gcc-loongarch64-linux-gnu \
              binutils-loongarch64-linux-gnu \
              libc6-dev-loong64-cross \
              wget lsb-release \
              software-properties-common gnupg
            buildllvm: |
              wget https://apt.llvm.org/llvm.sh
              chmod +x llvm.sh
              sudo ./llvm.sh 22

        feature: [ nano, pro ]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Rust (Full)
        uses: dtolnay/rust-toolchain@stable
        if: matrix.target.buildstd == false
        with:
          targets: ${{ matrix.target.name }}
          components: rust-src
          toolchain: nightly

      - name: Setup Rust (Light)
        uses: dtolnay/rust-toolchain@stable
        if: matrix.target.buildstd
        with:
          components: rust-src
          toolchain: nightly

      - name: Setup
        run: |
          # This registers binfmt_misc handlers for all architectures
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

          echo "deb http://deb.debian.org/debian sid main" | sudo tee -a /etc/apt/sources.list
          sudo apt-key adv --keyserver keyserver.ubuntu.com --recv-keys 6ED0E7B82643E131 78DBA3BC47EF2265

          sudo apt update
          sudo apt install ${{ matrix.target.tools }}

          ${{ matrix.target.buildllvm }}

      - name: Build SaVM
        uses: ./.github/actions/build-savm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          llvmargs: |
            --llvm-build=llvm-static-${{ matrix.target.llvm }}.tar.gz
          feature: ${{ matrix.feature }}
          rusttarget: ${{ matrix.target.name }}
          argv: --target ${{ matrix.target.name }}
          builder: cargo
          rust: "false"
          rustflags: ${{ matrix.target.rustflags }}

  linux_cross:
    name: Build SaVM ${{ matrix.feature }} (${{ matrix.target[0] }})

    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        target:
          [
            [ armv7-unknown-linux-gnueabihf, arm-linux-gnueabihf ],
            # [ loongarch64-unknown-linux-gnu, loongarch64-linux-gnu ],
          # [ mips64el-unknown-linux-gnuabi64, mips64el-linux-gnu ],
            [ powerpc64le-unknown-linux-gnu, powerpc64le-linux-gnu ],
            [ riscv64gc-unknown-linux-gnu, riscv64-linux-gnu ],
          ]
        feature: [ nano, pro ]

        include:
          - target: [ riscv64gc-unknown-linux-gnu, riscv64-linux-gnu ]
            feature: standard

          - target: [ riscv64gc-unknown-linux-gnu, riscv64-linux-gnu ]
            feature: pro_standard

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup QEMU
        run: |
          # This registers binfmt_misc handlers for all architectures
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Build SaVM
        uses: ./.github/actions/build-savm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          llvmargs: |
            --llvm-build=llvm-static-${{ matrix.target[1] }}.tar.gz
          feature: ${{ matrix.feature }}
          rusttarget: ${{ matrix.target[0] }}
          argv: --target ${{ matrix.target[0] }}
          builder: cross
