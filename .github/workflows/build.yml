name: SaVM Build Test

on:
  push:
  workflow_dispatch:

jobs:
  win32:
    name: Build SaVM ${{ matrix.feature }} (${{ matrix.target }})

    strategy:
      fail-fast: true
      matrix:
        target: [ x86_64-pc-windows-msvc, aarch64-pc-windows-msvc, i686-pc-windows-msvc ]
        feature: [ nano, standard, pro, pro_standard ]

        exclude:
          - target: i686-pc-windows-msvc
            feature: standard

          - target: i686-pc-windows-msvc
            feature: pro_standard

    runs-on: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build SaVM
        uses: ./.github/actions/build-savm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          llvmargs: --llvm-build=llvm-static-${{ matrix.target }}.tar.gz
          feature: ${{ matrix.feature }}
          rusttarget: ${{ matrix.target }}
          argv: --target ${{ matrix.target }}

  darwin:
    name: Build SaVM ${{ matrix.feature }} (${{ matrix.target[0] }})

    strategy:
      fail-fast: true
      matrix:
        target:
          [
            [ x86_64-apple-darwin, x86_64-apple-darwin ],
            [ aarch64-apple-darwin, arm64-apple-darwin ],
          ]
        feature: [ nano, standard, pro, pro_standard ]

    runs-on: |
      ${{ matrix.target[0] == 'aarch64-apple-darwin' && 'macos-26' ||  'macos-15-intel' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build SaVM
        uses: ./.github/actions/build-savm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          llvmargs: --llvm-build=llvm-static-${{ matrix.target[1] }}.tar.gz
          feature: ${{ matrix.feature }}
          rusttarget: ${{ matrix.target[0] }}
          argv: --target ${{ matrix.target[0] }}

  linux:
    name: Build SaVM ${{ matrix.feature }} (${{ matrix.target[0] }})

    strategy:
      fail-fast: true
      matrix:
        feature: [ nano, standard, pro, pro_standard ]
        target:
          [
            [ aarch64-unknown-linux-gnu, aarch64-linux-gnu ],
            [ x86_64-unknown-linux-gnu, x86_64-linux-gnu ],
            [ i686-unknown-linux-gnu, i686-linux-gnu ],
          ]

        include:
          - os: ubuntu-22.04-arm
            target: [ aarch64-unknown-linux-gnu, aarch64-linux-gnu ]

        exclude:
          - target: [ i686-unknown-linux-gnu, i686-linux-gnu ]
            feature: standard

          - target: [ i686-unknown-linux-gnu, i686-linux-gnu ]
            feature: pro_standard

    runs-on: ${{ matrix.os || 'ubuntu-22.04' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build SaVM
        uses: ./.github/actions/build-savm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          llvmargs: --llvm-build=llvm-static-${{ matrix.target[1] }}.tar.gz
          feature: ${{ matrix.feature }}
          rusttarget: ${{ matrix.target[0] }}
          argv: --target ${{ matrix.target[0] }}

  linux_cross:
    name: Build SaVM ${{ matrix.feature }} (${{ matrix.target[0] }})

    strategy:
      fail-fast: true
      matrix:
        target:
          [
            [ arm-unknown-linux-gnueabihf, arm-linux-gnu ],
            [ loongarch64-unknown-linux-gnu, loongarch64-linux-gnu ],
            [ mips64el-unknown-linux-gnuabi64, mips64el-linux-gnu ],
            [ powerpc64le-unknown-linux-gnu, powerpc64le-linux-gnu ],
            [ riscv64gc-unknown-linux-gnu, riscv64-linux-gnu ],
          ]
        feature: [ nano, pro ]

        include:
          - target: [ riscv64gc-unknown-linux-gnu, riscv64-linux-gnu ]
            feature: standard

          - target: [ riscv64gc-unknown-linux-gnu, riscv64-linux-gnu ]
            feature: pro_standard

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup QEMU
        run: |
          # This registers binfmt_misc handlers for all architectures
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Build SaVM
        uses: ./.github/actions/build-savm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          llvmargs: |
            --llvm-build=llvm-static-${{ matrix.target[1] }}.tar.gz
          feature: ${{ matrix.feature }}
          argv: --target ${{ matrix.target[0] }}
          builder: cross
