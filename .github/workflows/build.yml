name: SaVM Build Test

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  attestations: write

jobs:
  win32:
    name: Build SaVM ${{ matrix.feature }} (${{ matrix.target }})

    strategy:
      fail-fast: true
      matrix:
        target:
          [
            x86_64-pc-windows-msvc,
            aarch64-pc-windows-msvc,
            i686-pc-windows-msvc,
          ]
        feature: [nano, standard, pro, pro_standard]

        exclude:
          - target: i686-pc-windows-msvc
            feature: standard

          - target: i686-pc-windows-msvc
            feature: pro_standard

    runs-on: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build SaVM
        uses: ./.github/actions/build-savm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          llvmargs: --llvm-build=llvm-static-${{ matrix.target }}.tar.gz
          feature: ${{ matrix.feature }}
          rusttarget: ${{ matrix.target }}
          argv: --target ${{ matrix.target }}

  darwin:
    name: Build SaVM ${{ matrix.feature }} (${{ matrix.target[0] }})

    strategy:
      fail-fast: true
      matrix:
        target:
          [
            [x86_64-apple-darwin, x86_64-apple-darwin],
            [aarch64-apple-darwin, arm64-apple-darwin],
          ]
        feature: [nano, standard, pro, pro_standard]

    runs-on: ${{ matrix.target[0] == 'aarch64-apple-darwin' && 'macos-15' ||
      'macos-15-intel' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build SaVM
        uses: ./.github/actions/build-savm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          llvmargs: --llvm-build=llvm-static-${{ matrix.target[1] }}.tar.gz
          feature: ${{ matrix.feature }}
          rusttarget: ${{ matrix.target[0] }}
          argv: --target ${{ matrix.target[0] }}

  linux:
    name: Build SaVM ${{ matrix.feature }} (${{ matrix.target[0] }})

    strategy:
      fail-fast: true
      matrix:
        feature: [nano, standard, pro, pro_standard]
        target:
          [
            [aarch64-unknown-linux-gnu, aarch64-linux-gnu],
            [x86_64-unknown-linux-gnu, x86_64-linux-gnu],
            [i686-unknown-linux-gnu, i686-linux-gnu],
          ]

        include:
          - os: ubuntu-24.04-arm
            target: [aarch64-unknown-linux-gnu, aarch64-linux-gnu]

        exclude:
          - target: [i686-unknown-linux-gnu, i686-linux-gnu]
            feature: standard

          - target: [i686-unknown-linux-gnu, i686-linux-gnu]
            feature: pro_standard

    runs-on: ${{ matrix.os || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build SaVM
        uses: ./.github/actions/build-savm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          llvmargs: --llvm-build=llvm-static-${{ matrix.target[1] }}.tar.gz
          feature: ${{ matrix.feature }}
          rusttarget: ${{ matrix.target[0] }}
          argv: --target ${{ matrix.target[0] }}

  linux_crosscompile:
    name: Build SaVM ${{ matrix.target.feature }} (${{ matrix.target.rust }})

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        target:
          # MIPS64 (EL)
          - rust: mips64el-unknown-linux-gnuabi64
            clang: mips64el-linux-gnu
            feature: nano
            arch: mips64el
            exclude: --exclude satest

          - rust: mips64el-unknown-linux-gnuabi64
            clang: mips64el-linux-gnu
            feature: pro
            arch: mips64el
            exclude: --exclude satest

          # Armv7 (HF)
          - rust: armv7-unknown-linux-gnueabihf
            clang: armv7-linux-gnueabihf
            feature: nano
            arch: armhf
            exclude: --exclude satest

          - rust: armv7-unknown-linux-gnueabihf
            clang: armv7-linux-gnueabihf
            llvm: arm-linux-gnueabihf
            feature: pro
            arch: armhf
            exclude: --exclude satest

          # PowerPC 64-bit
          - rust: powerpc64le-unknown-linux-gnu
            clang: powerpc64le-linux-gnu
            feature: nano
            arch: ppc64el
            exclude: --exclude satest

          - rust: powerpc64le-unknown-linux-gnu
            clang: powerpc64le-linux-gnu
            feature: pro
            arch: ppc64el
            exclude: --exclude satest

          # RISC-V 64-bit (gc)
          - rust: riscv64gc-unknown-linux-gnu
            clang: riscv64-linux-gnu
            feature: nano
            arch: riscv64
            exclude: --exclude satest

          - rust: riscv64gc-unknown-linux-gnu
            clang: riscv64-linux-gnu
            feature: standard
            arch: riscv64

          - rust: riscv64gc-unknown-linux-gnu
            clang: riscv64-linux-gnu
            feature: pro
            arch: riscv64
            exclude: --exclude satest

          - rust: riscv64gc-unknown-linux-gnu
            clang: riscv64-linux-gnu
            feature: pro_standard
            arch: riscv64

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Rust (Full)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src
          toolchain: nightly

      - name: Setup LLVM
        shell: pwsh
        run: |
          function Invoke-WithRetry {
            param(
              [scriptblock]$Command,
              [int]$MaxRetries = 5,
              [int]$DelaySeconds = 2
            )
            $attempts = 0
            do {
              try {
                & $Command
                return
              }
              catch {
                $attempts++
                if ($attempts -ge $MaxRetries) { throw "Failed after $MaxRetries attempts." }
                Start-Sleep -Seconds $DelaySeconds
              }
            } while ($attempts -lt $MaxRetries)
          }
          
          Invoke-WithRetry -Command { ./sacli.ps1 llvm --llvm-build=llvm-static-${{ matrix.target.llvm || matrix.target.clang }}.tar.gz } -MaxRetries 5

      - name: Build SaVM
        run: |
          bash ./scripts/savm/sysroot.sh
          bash ./scripts/savm/build.sh
        env:
          LLVM_SYS_221_PREFIX: ${{ github.workspace }}/llvm/install
          ARCH: ${{ matrix.target.arch }}
          TARGET: ${{ matrix.target.rust }}
          CTARGET: ${{ matrix.target.clang }}
          EXTRA: --features savmrun/${{ matrix.target.feature }} ${{ matrix.target.exclude }}

          # Linker
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/target/${{ matrix.target.rust }}/release
          LIBRARY_PATH: ${{ github.workspace }}/target/${{ matrix.target.rust }}/release

      - name: Package
        shell: pwsh
        env:
          PACKAGE: savm-${{ matrix.target.rust }}-${{ matrix.target.feature }}
          TARGET: ${{ matrix.target.rust }}
        continue-on-error: true
        run: |
          ./package.ps1

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: savm-${{ matrix.target.rust }}-${{ matrix.target.feature }}
          path: |
            savm-${{ matrix.target.rust }}-${{ matrix.target.feature }}.zip
          archive: true
          compression-level: 0

