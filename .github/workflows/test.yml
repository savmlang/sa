name: Test SaVM

on:
  push:

jobs:
  init:
    name: Run test

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly

      - uses: actions/setup-node@v6
        with:
          node-version: ">=24"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Run
        working-directory: bin/satest
        run: |
          RUNS=20

          for ((i=1; i<=RUNS; i++)); do
            echo "Run $i:"
            
            cargo run --release
            python bench/index.py
          done
