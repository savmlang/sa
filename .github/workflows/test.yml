name: Test SaVM

on:
  push:

jobs:
  init:
    name: Run test

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly

      - uses: actions/setup-node@v6
        with:
          node-version: ">=24"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Install salloc
        working-directory: sart/saffi/libsalloc/allocator
        run: |
          cargo build --release

          sudo cp ./target/release/libsalloc.so /usr/lib/libsalloc.so
          sudo ldconfig

      - name: Run
        working-directory: bin/satest
        run: |
          cargo run --release

          echo "Python"
          python bench/0.py
          python bench/1.py

          echo "NodeJS"
          node bench/0.js
          node bench/1.js
